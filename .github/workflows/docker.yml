# Build the store image on every push to main and publish it to ghcr.io. The server picks it up on its own:
# autodeploy (ops/ovh-autodeploy.sh in the blazed-kitty repo) pulls new images every 5 minutes and restarts the store.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://freakytimes.com
          tags: |
            ghcr.io/dev-perceptric/freaky-times:latest
            ghcr.io/dev-perceptric/freaky-times:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
